<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="container mx-auto px-4 py-6 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold">EBook</h1>
        <p class="text-gray-600">v0.1-dev</p>
      </div>
      <nav class="flex gap-3">
        <a href="/" class="text-indigo-600 hover:text-indigo-800">Login</a>
        <a href="/dashboard" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h2 class="text-2xl font-semibold">All Books</h2>
        <p class="text-gray-600">Filter by category or explore the latest additions.</p>
      </div>
      <div class="flex items-center gap-3">
        <label for="search-input" class="text-sm font-medium text-gray-700">Search</label>
        <input type="text" id="search-input" placeholder="Search by title or author..." class="rounded-md border border-gray-300 px-3 py-2 flex-1" />
        <label for="category-filter" class="text-sm font-medium text-gray-700">Category</label>
        <select id="category-filter" class="rounded-md border border-gray-300 px-3 py-2">
          <option value="">All categories</option>
        </select>
      </div>
    </div>

    <div id="books-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    let allBooks = [];
    let currentLimit = 20;
    let currentUser = null;

    async function getCurrentUser() {
      try {
        const response = await fetch('/api/user');
        if (response.ok) {
          currentUser = await response.json();
          updateNav();
        }
      } catch (err) {
        // Not logged in
      }
    }

    function updateNav() {
      const navDiv = document.querySelector('nav');
      if (currentUser) {
        navDiv.innerHTML = `
          <a href="/home" class="text-indigo-600 hover:text-indigo-800">Home</a>
          <a href="/dashboard" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">Dashboard</a>
          <button id="logout-btn" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">Logout</button>
        `;
        document.getElementById('logout-btn').addEventListener('click', async () => {
          await fetch('/logout', { method: 'POST' });
          window.location.href = '/';
        });
      } else {
        navDiv.innerHTML = `
          <a href="/" class="text-indigo-600 hover:text-indigo-800">Login</a>
          <a href="/dashboard" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">Dashboard</a>
        `;
      }
    }

    async function loadCategories() {
      const response = await fetch('/api/categories');
      if (!response.ok) return [];
      return response.json();
    }

    async function loadBooks() {
      const response = await fetch('/api/books');
      if (!response.ok) return [];
      return response.json();
    }

    async function renderHome() {
      await getCurrentUser();
      const categories = await loadCategories();
      const categoryFilter = document.getElementById('category-filter');
      categories.forEach(category => {
        const option = document.createElement('option');
        option.value = category._id;
        option.textContent = category.name;
        categoryFilter.appendChild(option);
      });

      allBooks = await loadBooks();

      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          currentLimit = 20;
          renderBooks(categoryFilter.value, searchInput.value, currentLimit);
        }
      });

      categoryFilter.addEventListener('change', () => {
        currentLimit = 20;
        renderBooks(categoryFilter.value, searchInput.value, currentLimit);
      });

      renderBooks('', '', currentLimit);
    }

    function renderBooks(categoryId, searchQuery, limit) {
      let books = allBooks;
      if (categoryId) {
        books = books.filter(book => book.category?._id === categoryId);
      }
      if (searchQuery) {
        const query = searchQuery.toLowerCase();
        books = books.filter(book => 
          book.name.toLowerCase().includes(query) || 
          book.author.toLowerCase().includes(query)
        );
      }
      const displayedBooks = books.slice(0, limit);
      const booksGrid = document.getElementById('books-grid');
      if (!displayedBooks.length) {
        booksGrid.innerHTML = '<div class="col-span-full bg-white p-6 rounded-lg shadow-md text-gray-600">No books found.</div>';
        return;
      }
      booksGrid.innerHTML = displayedBooks.map(book => `
        <div class="bg-white rounded-lg shadow-md overflow-hidden" data-book-id="${book._id}">
          <img src="${book.thumbnailDirectory || '/uploads/thumbnail/default.jpg'}" alt="${book.name} thumbnail" class="w-full h-48 object-cover" />
          <div class="p-6">
            <h3 class="text-xl font-semibold mb-2">${book.name}</h3>
            <p class="text-gray-700 mb-2">Author: ${book.author}</p>
            <p class="text-sm text-gray-500 mb-4">Category: ${book.category?.name || 'Uncategorized'}</p>
            <p class="text-gray-600 mb-4">${book.description || ''}</p>
            <div class="flex gap-2">
              <a href="${book.pdfDirectory}" target="_blank" class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">Open PDF</a>
              <a href="/book/${book._id}" target="_blank" class="inline-block bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">View Comments</a>
            </div>
          </div>
        </div>
      `).join('');

      // Add load more button if there are more books
      if (books.length > limit) {
        const loadMoreDiv = document.createElement('div');
        loadMoreDiv.className = 'col-span-full text-center mt-6';
        loadMoreDiv.innerHTML = `<button id="load-more" class="bg-indigo-600 text-white px-6 py-3 rounded-md hover:bg-indigo-700">Load More</button>`;
        booksGrid.appendChild(loadMoreDiv);
        document.getElementById('load-more').addEventListener('click', () => {
          currentLimit += 20;
          renderBooks(categoryId, searchQuery, currentLimit);
        });
      }
    }

    renderHome();
  </script>
</body>
</html>
