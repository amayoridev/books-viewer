<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <header class="bg-white shadow-sm">
    <div class="container mx-auto px-4 py-6 flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold">Book Details</h1>
      </div>
      <nav class="flex gap-3">
        <a href="/home" class="text-indigo-600 hover:text-indigo-800">Back to Home</a>
        <a href="/dashboard" class="bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">Dashboard</a>
        <button id="logout-btn" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 hidden">Logout</button>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    <div id="book-details" class="bg-white rounded-lg shadow-md overflow-hidden mb-8">
      <!-- Book details will be loaded here -->
    </div>

    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-2xl font-semibold mb-4">Comments</h2>
      <div id="comments-list" class="mb-4"></div>
      <div id="comment-form">
        <!-- Comment form will be loaded here -->
      </div>
    </div>
  </main>

  <script>
    let currentUser = null;
    let bookId = new URLSearchParams(window.location.search).get('id') || window.location.pathname.split('/').pop();

    async function getCurrentUser() {
      try {
        const response = await fetch('/api/user');
        if (response.ok) {
          currentUser = await response.json();
          document.getElementById('logout-btn').classList.remove('hidden');
          document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/logout', { method: 'POST' });
            window.location.href = '/';
          });
        }
      } catch (err) {
        // Not logged in
      }
    }

    async function loadBook() {
      const response = await fetch(`/api/books/${bookId}`);
      if (!response.ok) return null;
      return response.json();
    }

    async function loadComments() {
      const response = await fetch(`/api/comments/${bookId}`);
      if (!response.ok) return [];
      return response.json();
    }

    async function renderBook() {
      const book = await loadBook();
      if (!book) {
        document.getElementById('book-details').innerHTML = '<p class="p-6 text-red-600">Book not found.</p>';
        return;
      }
      document.getElementById('book-details').innerHTML = `
        <img src="${book.thumbnailDirectory || '/uploads/thumbnail/default.jpg'}" alt="${book.name} thumbnail" class="w-full h-64 object-cover" />
        <div class="p-6">
          <h2 class="text-3xl font-bold mb-2">${book.name}</h2>
          <p class="text-xl text-gray-700 mb-2">Author: ${book.author}</p>
          <p class="text-sm text-gray-500 mb-4">Category: ${book.category?.name || 'Uncategorized'}</p>
          <p class="text-gray-600 mb-6">${book.description || ''}</p>
          <a href="${book.pdfDirectory}" target="_blank" class="inline-block bg-indigo-600 text-white px-6 py-3 rounded-md hover:bg-indigo-700">Open PDF</a>
        </div>
      `;
    }

    async function renderComments() {
      const comments = await loadComments();
      const commentsList = document.getElementById('comments-list');
      commentsList.innerHTML = '';
      if (comments.length === 0) {
        commentsList.innerHTML = '<p class="text-gray-500">No comments yet.</p>';
        return;
      }
      comments.forEach(comment => {
        const commentDiv = document.createElement('div');
        commentDiv.className = 'border-t pt-4 mt-4';
        commentDiv.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="font-semibold">${comment.user.username}</p>
              <p class="text-gray-700">${comment.text}</p>
              <p class="text-sm text-gray-500">${new Date(comment.createdAt).toLocaleString()}</p>
            </div>
            <div class="flex gap-2">
              ${currentUser && (currentUser._id === comment.user._id || currentUser.role === 'admin') ? `<button class="text-red-600 hover:text-red-800 delete-comment" data-comment-id="${comment._id}">Delete</button>` : ''}
              ${currentUser && currentUser.role === 'admin' ? `<button class="text-orange-600 hover:text-orange-800 hide-comment" data-comment-id="${comment._id}">Hide</button>` : ''}
            </div>
          </div>
        `;
        commentsList.appendChild(commentDiv);
      });

      // Add event listeners
      commentsList.querySelectorAll('.delete-comment').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (confirm('Are you sure you want to delete this comment?')) {
            const response = await fetch(`/api/comments/${btn.dataset.commentId}`, { method: 'DELETE' });
            if (response.ok) {
              renderComments();
            } else {
              alert('Failed to delete comment');
            }
          }
        });
      });
      commentsList.querySelectorAll('.hide-comment').forEach(btn => {
        btn.addEventListener('click', async () => {
          const response = await fetch(`/api/comments/${btn.dataset.commentId}/hide`, { method: 'PUT' });
          if (response.ok) {
            renderComments();
          } else {
            alert('Failed to hide comment');
          }
        });
      });
    }

    async function renderCommentForm() {
      const formDiv = document.getElementById('comment-form');
      if (currentUser) {
        formDiv.innerHTML = `
          <form class="comment-form">
            <textarea class="w-full p-2 border rounded-md" placeholder="Share your thoughts..." required></textarea>
            <button type="submit" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded-md hover:bg-indigo-700">Post Comment</button>
          </form>
        `;
        formDiv.querySelector('.comment-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const textarea = e.target.querySelector('textarea');
          const text = textarea.value.trim();
          if (!text) return;
          const response = await fetch(`/api/comments/${bookId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text })
          });
          if (response.ok) {
            textarea.value = '';
            renderComments();
          } else {
            alert('Failed to post comment');
          }
        });
      } else {
        formDiv.innerHTML = '<p class="text-gray-500">Login to comment.</p>';
      }
    }

    async function init() {
      await getCurrentUser();
      await renderBook();
      await renderComments();
      await renderCommentForm();
    }

    init();
  </script>
</body>
</html>
